name: 'PR Checks (docs only)'

on:
  pull_request:
    types: [opened, synchronize, edited, ready_for_review]
    branches: [main, dev]
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  code-quality:
    name: Code Quality
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check changed Markdown and documentation paths
        run: |
          git diff --check "origin/${{ github.base_ref }}...HEAD"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '\.(md|mdx)$|^docs/|^\.vscode/|^\.github/ISSUE_TEMPLATE/' >/dev/null

  unit-tests-macos:
    name: Unit Tests (macos-latest)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docs-only PR, skipping unit tests."
