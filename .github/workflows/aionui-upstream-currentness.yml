name: Check AionUI upstream currentness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aionui-upstream-currentness
  cancel-in-progress: true

jobs:
  currentness:
    name: Compare latest stable release with reviewed receipt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check official AionUI stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/aionui-upstream-currentness.mjs
