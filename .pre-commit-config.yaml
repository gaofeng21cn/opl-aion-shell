# Root pre-commit configuration for the App product repository.
# AionUI shell checks are invoked through the active shell path.

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: end-of-file-fixer
        exclude: '^(\.DS_Store|Thumbs\.db|.*\.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|pdf|zip|tar|gz|bz2|7z|exe|dll|so|dylib|node|bin))$'
      - id: trailing-whitespace
        exclude: '^(\.DS_Store|Thumbs\.db|.*\.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|pdf|zip|tar|gz|bz2|7z|exe|dll|so|dylib|node|bin|patch))$'

  - repo: local
    hooks:
      - id: active-shell-contract
        name: Active Shell Contract
        entry: node scripts/validate-active-shell.mjs --quick
        language: system
        files: '^(contracts/|scripts/validate-active-shell\.mjs|package\.json|shells/aionui/package\.json|shells/aionui/AGENTS\.md)'
        pass_filenames: false

      - id: shell-typecheck
        name: AionUI Shell TypeScript Check
        entry: bash -lc 'cd shells/aionui && bunx tsc --noEmit'
        language: system
        files: '^shells/aionui/.*\.(ts|tsx)$'
        pass_filenames: false

      - id: shell-oxlint
        name: AionUI Shell Oxlint
        entry: bun run --cwd shells/aionui lint
        language: system
        files: '^shells/aionui/.*\.(ts|tsx|js|jsx)$'
        pass_filenames: false

      - id: shell-oxfmt
        name: AionUI Shell Oxfmt
        entry: bun run --cwd shells/aionui format
        language: system
        files: '^shells/aionui/.*\.(ts|tsx|js|jsx|json|css|md|yaml|yml|toml)$'
        pass_filenames: false

      - id: shell-i18n-check
        name: AionUI Shell i18n Check
        entry: bash -lc 'cd shells/aionui && node scripts/check-i18n.js'
        language: system
        files: '^shells/aionui/src/renderer/services/i18n/locales/'
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, --force-scope, feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
